[package]
name = "proxy-watch-shared"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "What the Node, Python and C bindings of proxy-watch share"
publish = false

[dependencies]
# Every feature the bindings build with; the three binding crates add none.
proxy-watch = { path = "../..", default-features = false, features = ["resolve", "linux-gnome", "linux-kde", "pac-native"] }
futures-core = "0.3"

# QuickJS where `rquickjs-sys` ships bindings and the bindings' CI builds natively: x86-64 and
# AArch64 Windows, Linux and macOS. Elsewhere `pac: "quickjs"` answers
# `ERR_PAC_ENGINE_UNAVAILABLE`, and the build needs no C compiler.
[target.'cfg(all(any(target_arch = "x86_64", target_arch = "aarch64"), any(windows, target_os = "linux", target_os = "macos")))'.dependencies]
proxy-watch = { path = "../..", default-features = false, features = ["resolve", "linux-gnome", "linux-kde", "pac-native", "pac-quickjs"] }
