# `ndk-context` and `cesu8` offer MIT or Apache-2.0 and ship no license file. `ndk-context`
# names no holder anywhere; `cesu8` names its holders only in the header of `src/lib.rs`. They
# are taken under Apache-2.0, whose redistribution in object form asks for the license text
# and a `NOTICE` file, which neither has. The anchor is the manifest's `license` line, so a
# release that changes it fails the clarification; its `LicenseRef` keeps the line itself out
# of the Apache-2.0 text.
[ndk-context.clarify]
license = "Apache-2.0"

[[ndk-context.clarify.files]]
path = "Cargo.toml"
license = "LicenseRef-manifest"
start = 'license = "MIT OR Apache-2.0"'
end = 'license = "MIT OR Apache-2.0"'
checksum = "f2bbaa42e781363795f43c9bd4a73d8c76d0f5ed2ed837ad32318d61c52fb637"

[cesu8.clarify]
license = "Apache-2.0"

