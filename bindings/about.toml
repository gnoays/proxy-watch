# `cargo about` configuration for the third-party license notice each binding artifact
# ships. `cargo xtask third-party-licenses` renders it with `about.hbs`, one file per
# binding and target, since what links differs by target (`windows` on Windows, `inotify`
# on Linux, QuickJS on x86-64 and AArch64 desktops only). The workspace's own crates are
# left out: an artifact carries `LICENSE-MIT` and `LICENSE-APACHE` for those.
#
# Two kinds of linked code are not listed, because neither asks for a notice in a binary:
# the parts of LLVM's compiler-rt and libunwind that `compiler_builtins`, the zig linker and
# the NDK add (Apache-2.0 WITH LLVM-exception, which waives sections 4(a), 4(b) and 4(d) for
# compiled object code), and the `stat64`-family shims zig links for glibc 2.17 (LGPL-2.1+
# with glibc's exception for linking the compiled file into other programs). The NDK's
# `crtbegin_so.o`, which every Android library links, does ask for one; `cargo xtask` appends
# it to the Android notices.
#
# Accepted in priority order, so a crate offering `MIT OR Apache-2.0` is listed under MIT
# and `configparser` (`MIT OR LGPL-3.0-or-later`) under MIT rather than the LGPL.
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
]
# Build scripts and proc-macros run on the build machine and are not in the artifact.
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }

# `rquickjs-sys` compiles QuickJS's C sources into the artifact. Its manifest says `MIT`,
# but it has no license file of its own: the notice is the one QuickJS ships, with its four
# copyright holders, and the Unicode tables QuickJS generates carry the Unicode License.
# `quickjs.c` includes `quickjs-c-atomics.h` wherever C11 atomics exist, and that header
# carries its own MIT notice under a fifth holder.
#
# `cargo xtask` runs `cargo about` with `--fail`, so a clarification whose checksum no longer
# matches, or whose file is gone, stops the rendering, and a changed text is read rather than
# shipped unseen.
[rquickjs-sys.clarify]
license = "MIT AND Unicode-3.0"

[[rquickjs-sys.clarify.files]]
path = "quickjs/LICENSE"
license = "MIT"
checksum = "96f73f9d2a16c21a36b418f06073be26e7d6d5e7c1bc99756b21a4f2c74ef171"

