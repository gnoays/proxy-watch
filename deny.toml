# `cargo deny check`: the dependency graph's licenses, advisories, sources and duplicates.
# `audit.yml` runs it once a week and on a pull request that touches a manifest, the lock
# file or this file; locally, `cargo deny --all-features --workspace check` is the same
# command. `--workspace` makes every member a root, so the bindings' dependencies are in the
# graph too.

[graph]
# The graph is evaluated for every target cargo-deny knows, so every OS backend's
# dependencies are in it at once. `all-features` here is what makes the optional
# PAC engines and the `tokio` bridge part of the audited surface without a flag.
all-features = true

[advisories]
# https://github.com/rustsec/advisory-db
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses only. Every crate that offers a copyleft alternative (`configparser`
# is `MIT OR LGPL-3.0-or-later`) is taken under the permissive arm; the allowlist is what
# makes that choice explicit rather than something cargo-deny works out on its own.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8
# The workspace's own unpublished crates (`xtask`, `tests-gnome`, the bindings) are roots,
# not dependencies: the license that binds is the one their artifacts declare, and
# `xtask` and `tests-gnome` ship nothing to declare one for.
private = { ignore = true }

[bans]
# Two versions of one crate are a fact of a graph this wide (`syn` arrives twice through
# crates this library does not pick; the graph spans every target, so the `windows-sys`
# that `jni` names for Windows counts too, though no build links it).
# Reported, not refused: a library cannot flatten its dependents' choices.
multiple-versions = "warn"
wildcards = "deny"
# The workspace's unpublished crates name each other by `path` alone; a wildcard that never
# reaches a registry pins nothing anyone else resolves.
allow-wildcard-paths = true
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
