[package]
name = "proxy-watch"
version = "0.2.0"
edition = "2024"
# MSRV 1.88 (`let` chains).
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Read and watch the operating system's proxy settings, layered with *_proxy, and the route each URL takes under them"
authors = ["gnoays <169730769+gnoays@users.noreply.github.com>"]
readme = "README.md"
repository = "https://github.com/gnoays/proxy-watch"
keywords = ["proxy", "system-proxy", "pac", "watcher", "http"]
categories = ["network-programming", "os", "config"]
# Allowlist: only what a crate consumer needs. Leading `/` is load-bearing
# (gitignore-shaped; bare `README.md` would also match under `docs/`).
include = [
    "/build.rs",
    "/src/**/*.rs",
    "/src/sys/android/ProxyChangeReceiver.java",
    "/src/sys/android/receiver.dex",
    "/examples/*.rs",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[workspace]
members = ["xtask", "tests-gnome", "bindings/shared", "bindings/node", "bindings/python", "bindings/c"]
default-members = ["."]
resolver = "3"

# Features only *add* portable pieces. OS backends are target cfg, never features
# (except the Linux store toggles below).
[features]
default = ["resolve", "linux-gnome", "linux-kde"]
# `resolve()` + `ProxyStep`.
resolve = []
# `watch_channel()` → `tokio::sync::watch`.
tokio = ["dep:tokio"]
# Linux stores (inert off-Linux). `linux-gnome` opens GLib at run time and needs no C
# library or headers to build.
linux-gnome = ["dep:libloading"]
linux-kde = ["dep:notify", "dep:configparser"]
# PAC evaluation. Engine features are additive (Cargo unions features).
pac = ["resolve"]
# QuickJS through `rquickjs`: compiles C, so it needs a C compiler for the target. On Android
# and iOS it adds no engine (`build.rs`), so a desktop app's feature list builds there too.
pac-quickjs = ["pac", "dep:rquickjs"]
pac-windows-native = ["pac"]
# macOS only: PAC bodies and PAC URLs through CFNetwork. No extra dependency.
pac-macos-native = ["pac"]
# iOS only: the same CFNetwork calls as `pac-macos-native`.
pac-ios-native = ["pac"]
# Android only: PAC through the framework's `ProxySelector`, which the system PAC service
# answers. No extra dependency.
pac-android-native = ["pac"]
# Every native PAC resolver above; each builds only on its own OS, so one list serves all.
pac-native = [
    "pac-windows-native",
    "pac-macos-native",
    "pac-ios-native",
    "pac-android-native",
]
# `pac::SubprocessEvaluator`: each evaluation in a `proxy-watch-pac-worker` process, killed at
# the deadline. The parent side runs no JavaScript; the worker binary needs `pac-quickjs` too.
pac-subprocess = ["pac", "dep:libc"]
# Lifecycle / change logs. Off by default so the library does not pick a facade.
tracing = ["dep:tracing"]

[dependencies]
futures-core = { version = "0.3", default-features = false, features = ["std"] }
ipnet = "2.9"
thiserror = "2"
url = "2.5"

# `pac-quickjs` only; default-off. `rquickjs-sys` ships no Android or iOS bindings.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies.rquickjs]
version = "0.14"
optional = true

# Only `sync` + `rt`; absent when the `tokio` feature is off.
[dependencies.tokio]
version = "1"
optional = true
default-features = false
features = ["rt", "sync"]

# Drops `tracing-attributes`; `std` enables `set_global_default`.
[dependencies.tracing]
version = "0.1.41"
optional = true
default-features = false
features = ["std"]

# OS backends are target cfg, never Cargo features.
[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_System_JobObjects", # the `pac-subprocess` worker's memory limit
    "Win32_Security",         # SECURITY_ATTRIBUTES, required by CreateEventW
    "Win32_System_Registry",
    "Win32_System_Threading",
]

# `core-foundation` moves with `system-configuration`: 0.8 is built on 0.10, and two
# versions would split the CF types the two hand each other.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
system-configuration = "0.8"

# Optional via `linux-gnome` / `linux-kde`.
[target.'cfg(target_os = "linux")'.dependencies]
libloading = { version = "0.9", optional = true }
notify = { version = "8", optional = true }
configparser = { version = "3", optional = true }
# `pac-subprocess` only: `RLIMIT_AS` on the worker.
libc = { version = "0.2", optional = true }

# Android reads through the Java framework: `jni` calls it. The `JavaVM` and `Context` come
# from `proxy_watch::android::init`, or else from `ndk-context`, which android-activity fills.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

# iOS reads `CFNetworkCopySystemProxySettings`, the same dictionary schema macOS's store holds.
[target.'cfg(target_os = "ios")'.dependencies]
core-foundation = "0.10"

[dev-dependencies]
futures-executor = "0.3"
# `StreamExt::next()` in the README and `examples/watch.rs`.
futures-util = "0.3"
# `examples/reqwest_client.rs` only.
reqwest = { version = "0.13", default-features = false }
# `tracing` feature tests only (always compiled as a dev-dep; never reaches consumers).
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }

# `tests/mac_configd_denied.rs` needs `SCDynamicStoreBuilder` directly; keep in lockstep
# with the normal macOS dependency above.
[target.'cfg(target_os = "macos")'.dev-dependencies]
system-configuration = "0.8"

[[bin]]
name = "proxy-watch-pac-worker"
path = "src/bin/proxy-watch-pac-worker.rs"
required-features = ["pac-subprocess", "pac-quickjs"]

[[example]]
name = "resolve"
required-features = ["resolve"]

[[example]]
name = "resolve_os_and_env"
required-features = ["resolve"]

[[example]]
name = "reqwest_client"
required-features = ["resolve"]

[[example]]
name = "pac"
required-features = ["pac-quickjs"]

[package.metadata.docs.rs]
# Every feature but `pac-quickjs`. docs.rs builds every target below on Linux, where the build
# script of `rquickjs-sys` hands the host `cc` MSVC flags (`/std:c11`) for Windows and `-arch`
# for macOS, and `cc` rejects both. The Windows target is the default page. `android::init`
# and `pac::AndroidPacResolver` appear on the Android page only.
features = [
    "resolve",
    "linux-gnome",
    "linux-kde",
    "tokio",
    "pac",
    "pac-windows-native",
    "pac-macos-native",
    "pac-ios-native",
    "pac-android-native",
    "pac-native",
    "pac-subprocess",
    "tracing",
]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-linux-android",
    "aarch64-apple-ios",
]
# Paired with `#![cfg_attr(docsrs, feature(doc_cfg))]` in `src/lib.rs`; neither half does
# anything alone.
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
