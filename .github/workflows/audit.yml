name: Audit

# `cargo deny check` over the whole dependency graph: advisories, licenses, sources and
# duplicate versions, with `deny.toml` at the repository root saying what is allowed. The
# graph is every workspace member's (the bindings ship `napi`, `pyo3` and the rest of
# what the library does not), because a manifest that is also a package is a graph of one
# root unless `--workspace` says otherwise. A second job renders the third-party license
# notice each binding artifact ships, which fails on the same kind of change and on a
# stable toolchain whose standard library sources moved.
#
# Separate from `CI` because its trigger is different in kind. An advisory lands on a
# schedule of its own, with no commit to fire on, so the weekly run is the one that
# actually catches it; the pull-request run only re-checks a graph someone just moved.

on:
  pull_request:
    branches: [main]
    paths:
      - '**/Cargo.toml'
      - Cargo.lock
      - deny.toml
      - bindings/about.toml
      - bindings/about.hbs
      - xtask/src/std_notice.rs
      - xtask/src/crt_notice.rs
      - xtask/src/linked.rs
      - .github/scripts/install_cargo_about.sh
      - .github/workflows/audit.yml
    # A draft runs nothing, by each job's `if`; marking it ready for review runs it.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths:
      - '**/Cargo.toml'
      - Cargo.lock
      - deny.toml
      - bindings/about.toml
      - bindings/about.hbs
      - xtask/src/std_notice.rs
      - xtask/src/crt_notice.rs
      - xtask/src/linked.rs
      - .github/scripts/install_cargo_about.sh
      - .github/workflows/audit.yml
  schedule:
    # Monday 06:00 UTC. GitHub disables a schedule on a public repository after sixty
    # days without a commit; re-enable it from the Actions tab if the crate goes quiet.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# The job reads the repository and nothing else.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deny:
    name: cargo deny
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A Docker action, so Linux only; the graph it checks already spans every target
      # (`[graph]` in `deny.toml`), so one runner sees the Windows and macOS backends too.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features --workspace

  # The notice each binding artifact ships, rendered for every binding and target from
  # `bindings/about.toml`. Fails on a license outside its `accepted` list and on a clarified
  # text (QuickJS's) that an update changed, so either is read before an artifact ships it.
  third-party-licenses:
    name: third-party licenses
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Each notice ends with the standard library's section for its target, read from that
      # target's sysroot and the `rust-src` sources.
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,armv7-unknown-linux-gnueabihf,x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,x86_64-apple-darwin,aarch64-apple-darwin,x86_64-pc-windows-msvc,aarch64-pc-windows-msvc,aarch64-linux-android,x86_64-linux-android
          components: rust-src
      - name: Install cargo-about
        run: bash .github/scripts/install_cargo_about.sh
      - name: cargo xtask third-party-licenses
        run: cargo xtask third-party-licenses
