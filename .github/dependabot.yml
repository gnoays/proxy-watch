# Two ecosystems, one pull request each per month, every update in it grouped, all into
# `develop`. A pull request into `develop` starts no workflow, so a Dependabot rebase costs
# no runner time; the bump is checked with the rest of `develop` on its pull request into
# `main`, or by dispatch on the Dependabot branch when it needs checking sooner.
#
# `github-actions` moves the commit SHAs in `workflows/*.yml` and rewrites the version
# comment beside each one. `dtolnay/rust-toolchain` publishes no release tags, so its pin
# is a `master` head with `# master` beside it, which stays true of whatever SHA comes.
#
# `cargo` bumps `Cargo.lock` and, when a new release falls outside the requirement,
# `Cargo.toml`. The MSRV job in `ci.yml` is what refuses a bump that raises the floor.
# `jni` 0.22 rewrites the JNI API the Android backend is written against, so it waits for
# a port that can be run on Android, outside these pull requests.
#
# `cooldown` keeps a release out of the pull request until it has been public for a
# week: a compromised or yanked release is usually found within days, and nothing here
# needs the newest version the day it lands.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: jni
        versions: [">=0.22"]
    groups:
      cargo:
        patterns:
          - "*"
